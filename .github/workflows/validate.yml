name: Validate BuildWright

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate BuildWright catalogs, styles, fixtures, composition, and whole-building compilers
        shell: powershell
        run: ./tools/validate_repo.ps1
      - name: Run unit tests
        shell: powershell
        run: python -m unittest discover -s tests -v

name: Validate BuildWright

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate BuildWright catalogs
        shell: powershell
        run: ./tools/validate_repo.ps1
      - name: Run unit tests
        shell: powershell
        run: python -m unittest discover -s tests -v
